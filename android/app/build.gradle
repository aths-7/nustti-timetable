plugins {
    id 'com.android.application'
}

// 本机 release 签名：keystore 与口令存放于仓库外，不入 git
def keystorePropsFile = new File("C:/Users/Aths/AppData/Roaming/Tencent/Marvis/User/oAN1i2ekDRYQVs4rgC36qkvyR49I/workspace/conv_e382461f50ef4eb4858d00cc6b5e1793/temp/keystore/keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'edu.nustti.timetable'
    compileSdk 35
    // 本机 SDK 只装了 35.0.1 / 36.0.0 / 37.0.0，显式指定，避免 AGP 默认去找 34.0.0
    buildToolsVersion '35.0.1'

    defaultConfig {
        applicationId "edu.nustti.timetable"
        minSdk 24
        targetSdk 35
        versionCode 24
        versionName "3.1.0"
    }

    signingConfigs {
        debug {
            // 项目固定 debug 签名：keystore 入库（android/keystore/nustti-debug.keystore），口令在 gradle.properties，
            // 本地与 CI 共用同一签名，解决每次安装“与已应用签名不同”(-7)
            storeFile rootProject.file("keystore/nustti-debug.keystore")
            storePassword NUSTTI_DEBUG_STORE_PASSWORD
            keyAlias NUSTTI_DEBUG_KEY_ALIAS
            keyPassword NUSTTI_DEBUG_KEY_PASSWORD
        }
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    // 客户端直连教务系统官网后，课表 HTML 解析改在手机端完成
    implementation 'org.jsoup:jsoup:1.18.1'
}
