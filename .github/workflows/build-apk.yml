name: Build Android APK

# 触发方式：Actions 页面手动点 Run workflow，或 push 到 main/master 自动构建
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  apk:
    name: gradle android debug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 执行 gradle assembleDebug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug 2>&1 | tee /tmp/gradle_full.log

      - name: 列出产物
        if: always()
        run: |
          echo "--- outputs ---"
          ls -lh android/app/build/outputs/apk/debug/ 2>/dev/null || true

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nustti-timetable-apk
          if-no-files-found: error
          retention-days: 30
          path: android/app/build/outputs/apk/debug/*.apk

      # 关键：把构建结论 / APK / 日志尾部回传到 ci-artifacts 分支。
      # 本机直连 github.com 的 HTTPS 受限，走 git 协议（SSH 443）即可取回产物。
      - name: 回传结果到 ci-artifacts 分支
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle | head -1)
          OUT=/tmp/ci-out
          rm -rf "$OUT"; mkdir -p "$OUT"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$OUT/nustti_timetable-${VER}-debug.apk" 2>/dev/null || true
          if [ -f /tmp/gradle_full.log ]; then
            tail -n 1200 /tmp/gradle_full.log > "$OUT/build-log-tail.txt" || true
            grep -n -i -E "error:|FAILURE:|Exception|No such file|not found|Could not" /tmp/gradle_full.log | tail -n 300 > "$OUT/build-log-errors.txt" || true
          fi
          {
            echo "{"
            echo "  \"status\": \"${{ job.status }}\","
            echo "  \"sha\": \"$GITHUB_SHA\","
            echo "  \"run_id\": \"$GITHUB_RUN_ID\","
            echo "  \"attempt\": \"$GITHUB_RUN_ATTEMPT\","
            echo "  \"time_utc\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\""
            echo "}"
          } > "$OUT/build-status.json"
          ls -lh "$OUT"
          cd "$OUT"
          git init -q
          git checkout -q -b ci-artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "ci run $GITHUB_RUN_ID: ${{ job.status }}" || true
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push -f origin ci-artifacts
