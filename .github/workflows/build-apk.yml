name: Build Android APK

# 触发方式：Actions 页面手动点 Run workflow，或 push 到 main/master 自动构建
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "打包架构"
        required: false
        default: "arm64-v8a"
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - arm64-v8a,armeabi-v7a
  push:
    branches: [ main, master ]

permissions:
  contents: write

env:
  # python-for-android 编译 libffi 时需要 libtool 的 m4 宏，显式指定宏搜索路径
  ACLOCAL_PATH: /usr/share/aclocal

jobs:
  apk:
    name: buildozer android debug
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17 与 buildozer 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-pip python3-venv \
            autoconf automake libtool pkg-config gettext \
            autoconf-archive libltdl-dev libtool-bin m4 \
            zlib1g-dev libncurses-dev libncursesw5-dev libffi-dev libssl-dev \
            cmake ccache
          # libtinfo5 只在 Ubuntu 22.04 之前可用，24.04 上已并入 libtinfo6，装不上不算失败
          sudo apt-get install -y libtinfo5 || sudo apt-get install -y libtinfo-dev || true

      - name: 安装 buildozer / Cython
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install buildozer cython virtualenv

      - name: 打印工具链版本
        run: |
          java -version
          python3 --version
          buildozer --version

      # 缓存 Android SDK/NDK（约 4~6GB，命中后单次构建可省 10~20 分钟）
      - name: 缓存 Android SDK / NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-r25b
          key: android-sdk-ndk-r25b-v1

      # 缓存 python-for-android 的中间产物（随 buildozer.spec 变化失效）
      - name: 缓存 .buildozer 构建目录
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: 执行 buildozer android debug
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          set -o pipefail
          export ARCHS="${{ github.event.inputs.arch || 'arm64-v8a' }}"
          # spec 里写死了 arm64-v8a，若手动选择了别的架构就在构建前改掉
          if [ "$ARCHS" != "arm64-v8a" ]; then
            sed -i "s/^android.archs = .*/android.archs = $ARCHS/" buildozer.spec
          fi
          # 首次构建会下载 SDK/NDK 并全量编译，务必给足时间；
          # 不加 yes| 管道：spec 里 android.accept_sdk_license = True 已自动接受许可
          # tee 保留完整输出，供后续步骤回传给本地排错
          buildozer -v android debug 2>&1 | tee /tmp/buildozer_full.log

      - name: 列出产物
        if: always()
        run: |
          echo "--- bin ---"; ls -lh bin/ 2>/dev/null || true
          echo "--- dist ---"; ls -lh dist/ 2>/dev/null || true

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nustti-timetable-apk
          if-no-files-found: error
          retention-days: 30
          path: |
            bin/*.apk
            dist/*.apk

      - name: 构建失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          retention-days: 7
          path: |
            .buildozer/android/platform/build-*/build.log
            .buildozer/android/platform/build-*/dists/*/*.log
          if-no-files-found: ignore

      # 关键：把构建结论 / APK / 日志尾部回传到 ci-artifacts 分支。
      # 本机直连 github.com 的 HTTPS 受限，走 git 协议（SSH 443）即可取回产物。
      - name: 回传结果到 ci-artifacts 分支
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT=/tmp/ci-out
          rm -rf "$OUT"; mkdir -p "$OUT"
          cp bin/*.apk "$OUT"/ 2>/dev/null || true
          cp dist/*.apk "$OUT"/ 2>/dev/null || true
          if [ -f /tmp/buildozer_full.log ]; then
            tail -n 1200 /tmp/buildozer_full.log > "$OUT/build-log-tail.txt" || true
            grep -n -i -E "error:|Command failed|Traceback|Exception|No such file|not found" \
              /tmp/buildozer_full.log | tail -n 300 > "$OUT/build-log-errors.txt" || true
          fi
          {
            echo "{"
            echo "  \"status\": \"${{ job.status }}\","
            echo "  \"sha\": \"$GITHUB_SHA\","
            echo "  \"run_id\": \"$GITHUB_RUN_ID\","
            echo "  \"attempt\": \"$GITHUB_RUN_ATTEMPT\","
            echo "  \"time_utc\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\""
            echo "}"
          } > "$OUT/build-status.json"
          ls -lh "$OUT"
          cd "$OUT"
          git init -q
          git checkout -q -b ci-artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "ci run $GITHUB_RUN_ID: ${{ job.status }}" || true
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push -f origin ci-artifacts
